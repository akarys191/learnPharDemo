<!doctype html>
<html th:fragment="layout (template, menu)" xmlns:sec="http://www.w3.org/1999/xhtml">

<head>

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="shortcut icon" type="image/x-icon" th:href="@{/resources/images/favicon.png}">

    <title>Drug store :: a Spring Framework demonstration</title>
    <link rel="stylesheet" href="/css/pharmDemo.css">
    <!-- Bootstrap Table -->
    <link rel="stylesheet" href="/libs/css/bootstrap-table.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="/libs/css/fontawesome.css">
    <!-- Bootstrap core CSS -->
    <link href="/libs/css/bootstrap.min.css" rel="stylesheet">
    <!-- Material Design Bootstrap -->
    <link href="/libs/css/mdb.min.css" rel="stylesheet">
    <!-- JQuery UI Css -->
    <link rel="stylesheet" href="/libs/css/jquery-ui.min.css">
    <link rel="stylesheet" href="/libs/css/mdb.min.css">
    <!-- JQuery -->
    <script type="text/javascript" src="/libs/js/jquery.min.js"></script>
    <!-- JQuery UI -->
    <script src="/libs/js/jquery-ui.min.js"></script>
    <!-- Bootstrap tooltips -->
    <script type="text/javascript" src="/libs/js/popper.min.js"></script>
    <!-- Bootstrap core JavaScript -->
    <script type="text/javascript" src="/libs/js/bootstrap.min.js"></script>
    <script type="text/javascript" src="/libs/js/twbs-pagination/jquery.twbsPagination.min.js"></script>
    <script type="text/javascript" src="/libs/js/twbs-pagination/jquery.twbsPagination.js"></script>

    <script type="text/javascript" src="/libs/js/bootbox/bootbox.min.js"></script>
    <!-- MDB core JavaScript -->
    <script type="text/javascript" src="/libs/js/mdb.min.js"></script>
    <link rel="stylesheet" href="/libs/css/all.css">
</head>
<body id="layout">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
    <a class="navbar-brand badge" href="/"><h1>911</h1></a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbar1" aria-controls="navbar1"
            aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div sec:authorize="isAuthenticated()" class="collapse navbar-collapse" id="navbar1">
        <ul class="navbar-nav mr-auto">
            <li th:fragment="menuItem (path,active,title,glyph,text)"
                th:class="${active==menu ? 'nav-item active' : 'nav-item'}">
                <a th:class="nav-link" th:href="@{__${path}__}" th:title="${title}">
                    <i th:class="'fa fa-'+${glyph}"></i>
                    <span th:text="${text}">Template</span>
                </a>
            </li>
            <li th:class="nav-item"
                th:replace="::menuItem ('/suppliers/listSuppliers','suppliers','suppliers','th-list',#{suppliersText})">
                <a class="nav-link" href="#" th:text="#{suppliersText}">Suppliers</a>
            </li>
            <li th:class="nav-item"
                th:replace="::menuItem ('/medicines/listMedicines','medicines','medicines','th-list',#{medicinesText})">
                <a class="nav-link" href="#">Medicines</a>
            </li>
            <li class="nav-item"
                th:replace="::menuItem ('/inventory/listInventory','inventory','inventory','th-list',#{inventoryText})">
                <a class="nav-link" href="#">Inventory</a>
            </li>
            <li class="nav-item"
                th:replace="::menuItem ('/invoices/listInvoices','invoices','invoices','th-list',#{invoicesText})">
                <a class="nav-link" href="#">Invoices</a>
            </li>
            <li class="nav-item" th:replace="::menuItem ('/oups','Sales','Sales','th-list',#{salesText})">
                <a class="nav-link" href="#">Sales</a>
            </li>
        </ul>
        <form class="form-inline my-2 my-lg-0">
            <input class="form-control mr-sm-2" type="search" th:placeholder="#{findMedicineText}" aria-label='Search'>
            <button class="btn my-2 my-sm-0" th:text="#{searchText}" type="submit">Search</button>
        </form>
        <li class="nav-item dropdown">
            <div class="languageLinks">
                <a class="nav-link" href="#">Ru</a>
                <a class="nav-link" href="#">En</a>
            </div>
            <a class="fas fa-sign-out-alt nav-link dropdown-toggle" href="#" id="navbarDropdown1" role="button"
               data-toggle="dropdown"
               aria-haspopup="true" aria-expanded="false" th:text="#{signOutText}"></a>
            <div class="dropdown-menu" aria-labelledby="navbarDropdown1">
                <a class="dropdown-item" th:href="@{/logout}" th:text="#{signOutText}"></a>
                <div class="dropdown-divider"></div>
                <a class="dropdown-item" href="#">
                    <b th:text="#{loggedAsText}"></b> <span sec:authentication="name"></span>
                    <b th:text="#{hasRoleText}"></b> <span sec:authentication="principal.authorities"></span>
                </a>
            </div>
        </li>
    </div>
</nav>

<div class="container-fluid">
    <div class="container xd-container">

        <th:block th:include="${template}"/>

        <br/>
        <br/>
        <div class="container">
            <div class="row">
                <div class="col-12 text-center">
                    <img src="../static/resources/images/spring-pivotal-logo.png"
                         th:src="@{/resources/images/spring-pivotal-logo.png}"
                         alt="911"/>
                    <h3></h3></div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript" src="/js/baseFunctions.js"></script>
</body>

</html>
