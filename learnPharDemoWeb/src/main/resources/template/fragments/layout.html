<!doctype html>
<html th:fragment="layout (template, menu)" xmlns:sec="http://www.w3.org/1999/xhtml">

<head>

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="shortcut icon" type="image/x-icon" th:href="@{/resources/images/favicon.png}">

    <title>Drug store :: a Spring Framework demonstration</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="/css/fontawesome.css">
    <!-- Bootstrap core CSS -->
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <!-- Material Design Bootstrap -->
    <link href="/css/mdb.min.css" rel="stylesheet">
    <!-- JQuery UI Css -->
    <link rel="stylesheet" href="/css/jquery-ui.css">
    <!-- Bootstrap Table -->
    <link rel="stylesheet" href="/css/bootstrap-table.min.css">
    <!-- JQuery -->
    <script type="text/javascript" src="/js/jquery.min.js"></script>
    <!-- JQuery UI -->
    <script src="/js/jquery-ui.js"></script>
    <!-- Bootstrap tooltips -->
    <script type="text/javascript" src="/js/popper.min.js"></script>
    <!-- Bootstrap core JavaScript -->
    <script type="text/javascript" src="/js/bootstrap.min.js"></script>
    <!-- MDB core JavaScript -->
    <script type="text/javascript" src="/js/mdb.min.js"></script>
    <script src="/js/messagePrompt.js"></script>

</head>

<body>
<nav class="navbar navbar-default" role="navigation">
    <div class="container">
          <span sec:authorize="isAuthenticated()" style="color:white;">
           <div class="navbar-collapse collapse" id="main-navbar">
            <ul class="nav navbar-nav navbar-right">

                <li th:fragment="menuItem (path,active,title,glyph,text)" class="active" th:class="${active==menu ? 'active' : ''}">
                    <a th:href="@{__${path}__}" th:title="${title}">
                        <span th:class="'glyphicon  glyphicon-'+${glyph}" class="glyphicon glyphicon-home" aria-hidden="true"></span>
                        <span th:text="${text}">Template</span>
                    </a>
                </li>

                <li th:replace="::menuItem ('/','home','home page','home','Home')">
                    <span class="glyphicon glyphicon-home" aria-hidden="true"></span>
                    <span>Home</span>
                </li>

                <li th:replace="::menuItem ('/medicines/listMedicines','medicines','','search','Medicines')">
                    <span class="glyphicon glyphicon-search" aria-hidden="true"></span>
                    <span>Find Medicines</span>
                </li>
                <li th:replace="::menuItem ('/suppliers/listSuppliers','suppliers','suppliers','th-list','Suppliers')">
                    <span class="glyphicon glyphicon-th-list" aria-hidden="true"></span>
                    <span>Suppliers</span>
                </li>

                 <li th:replace="::menuItem ('/inventory/listInventory','inventory','inventory','th-list','Inventory')">
                    <span class="glyphicon glyphicon-th-list" aria-hidden="true"></span>
                    <span>Inventory</span>
                </li>
                <li th:replace="::menuItem ('/invoices/listInvoices','invoices','invoices','th-list','Invoices')">
                    <span class="glyphicon glyphicon-th-list" aria-hidden="true"></span>
                    <span>Invoices</span>
                </li>
                <li th:replace="::menuItem ('/oups','Sales','Sales','Sales','Sales')">
                    <span class="glyphicon glyphicon-warning-sign" aria-hidden="true"></span>
                    <span>Sales</span>
                </li>
                <li>
                    <div class="dropdown" style="margin-top:0px; margin-left:150px;">
                                <button class="dropbtn"></button>
                            <div class="dropdown-content">
                                <a th:href="@{/logout}">Sign Out</a>
                            </div>
                                Logged user: <span sec:authentication="name"></span>
                                Roles: <span sec:authentication="principal.authorities"></span>
                    </div>
                </li>
            </ul>
          </div>
        </span>
    </div>
</nav>
<div class="container-fluid">
    <div class="container xd-container">

        <th:block th:include="${template}"/>

        <br/>
        <br/>
        <div class="container">
            <div class="row">
                <div class="col-12 text-center">
                    <img src="../static/resources/images/spring-pivotal-logo.png" th:src="@{/resources/images/spring-pivotal-logo.png}"
                         alt="911"/>
                <h3></h3></div>
            </div>
        </div>
    </div>
</div>

</body>

</html>
