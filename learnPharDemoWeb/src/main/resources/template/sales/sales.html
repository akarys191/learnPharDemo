<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'invoices')}"
      xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Learn Pharm Demo</title>
</head>


<body id="editableTableBody" class="editableTableBody">
<!-- Editable table -->
<div id="cardDiv" class="card">
    <form method="POST" id="edit_form"></form>
    <form method="POST" id="add_form"></form>
    <input type="hidden" id="invoiceId" name="invoice" th:value="${invoice.id}"/>
    <input type="hidden" id="totalPages" name="invoice" th:value="${totalPages}"/>
    <h3 class="card-header text-center font-weight-bold text-uppercase py-4" th:text="#{invoiceInventories}">
        Invoices</h3>
    <div class="card-body">
        <div id="table" class="table-editable" th:fragment="editableTable">
      <span class="table-add float-right mb-3 mr-2"><a href="#!" class="text-success"><i
              class="fas fa-plus fa-2x" aria-hidden="true"></i></a></span>
            <table class="table table-bordered table-responsive-md table-striped text-center">
                <thead>
                <tr>
                    <th style="width: 150px;" th:text="#{medicineText}"> medicine</th>
                    <th style="width: 150px;" th:text="#{customer}"> Customer</th>
                    <th style="width: 150px;" th:text="#{suppliersText}"> supplier</th>
                    <th style="width: 150px;" th:text="#{priceText}"> price</th>
                    <th style="width: 150px;" th:text="#{suppliedCostText}"> suppliedCost</th>
                    <th style="width: 150px;" th:text="#{suppliedDateText}"> suppliedDate</th>
                    <th style="width: 150px;" th:text="#{quantityText}"> Quantity</th>
                    <th style="width: 150px;" th:text="#{acceptingPharmacistText}"> acceptingPharmacist</th>
                    <th style="width: 150px;"> *</th>
                    <th style="width: 150px;"> **</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="inventory, iStat  : ${invoiceInventoryPage.content}"
                    th:style="${iStat.odd}? 'font-weight: bold;'"
                    th:alt-title="${iStat.even}? 'even' : 'odd'">
                    <td class="pt-3-half">
                        <th:block th:text="${inventory.medicine.name}"></th:block>
                        <input type="hidden" id="medicineId" th:value="${inventory.medicine.id}"/>
                        <input type="hidden" id="medicineName" th:value="${inventory.medicine.name}"/>
                    </td>
                    <td class="pt-3-half" id="invoiceTd" th:text="${inventory.invoice.id}">invoice</td>
                    <td class="pt-3-half">
                        <th:block th:text="${inventory.supplier.name}"></th:block>
                        <input type="hidden" id="supplierHiddenId" th:value="${inventory.supplier.id}"/>
                    </td>
                    <td class="pt-3-half" th:text="${inventory.price}">price</td>
                    <td class="pt-3-half" th:text="${inventory.suppliedCost}">suppliedCost</td>
                    <td class="pt-3-half" th:text="${inventory.suppliedDate}">suppliedDate</td>
                    <td class="pt-3-half" th:text="${inventory.quantity}">Quantity</td>
                    <td class="pt-3-half">
                        <th:block th:text="${inventory.acceptingPharmacist.name}"></th:block>
                        <input type="hidden" id="pharmacistHiddenId" th:value="${inventory.acceptingPharmacist.id}"/>
                    </td>
                    <td class="pt-3-half">
                        <input type="hidden" name="inventoryId" th:value="${inventory.inventoryId}"/>
                        <span class="table-up"><a href="#!" class="indigo-text"><i class="fas fa-long-arrow-alt-up"
                                                                                   aria-hidden="true"></i></a></span>
                        <span class="table-down"><a href="#!" class="indigo-text"><i class="fas fa-long-arrow-alt-down"
                                                                                     aria-hidden="true"></i></a></span>
                    </td>
                    <td>
                        <div sec:authorize="hasAuthority('ADMIN')">
                            <span class="table-edit"><button type="button"><i
                                    class="fas fa-edit"
                                    style="font-size:20px;color:red"
                                    aria-hidden="true"></i></button></span>
                        </div>
                        <span class="table-submit" style="display: none;"><button type="button"
                        ><i class="fa fa-paper-plane" style="color:red" aria-hidden="true"></i></button></span>
                        <span class="table-remove" style="display: none;"><button type="button"
                        ><i class="fa fa-times-circle" style="color:red" aria-hidden="true"></i></button></span>
                    </td>
                </tr>
                </tbody>
            </table>
            <div>
                <label style="display: flex;" th:text="#{labelTotalPaidNum} +': '+ ${totalPaidNum}">totalPaidNum</label>
                <label style="display: flex;"
                       th:text="#{labelTotalPaidSum}  +': '+ ${totalPaidSum}  +' '+  #{currencyTenge}">totalPaidSum</label>
            </div>
        </div>
    </div>
</div>
<div class="wrapper">
    <div class="container">
        <div class="row">
            <div class="col-sm-12">
                <ul id="pagination-inventory" class="pagination-lg pull-right"></ul>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript" src="/js/editableTable/editableTableBase.js"></script>
<script type="text/javascript" src="/js/editableTable/editableTable.js"></script>
<script type="text/javascript" src="/libs/js/scanner/jquery.scannerdetection.js"></script>
<script type="text/javascript" src="/js/detectEnterCustomAction.js"></script>
</body>
</html>
